<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدردشة الحية - sky7</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar glass-card">
        <div class="nav-container">
            <a href="/home" class="nav-logo">
                <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7 logo">
                <span>sky7</span>
            </a>
            <div class="nav-menu">
                <a href="/home" class="nav-link">الرئيسية</a>
                <a href="/users" class="nav-link">الأصدقاء</a>
                <a href="/chat" class="nav-link active">الدردشة</a>
                <a href="/profile" class="nav-link">الملف الشخصي</a>
            </div>
        </div>
    </nav>

    <div class="container chat-container">
        <div class="glass-card chat-layout">
            
            <!-- SIDEBAR: Conversations List -->
            <div class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h3>المحادثات</h3>
                </div>
                <div class="conversations-list" id="conversations-list">
                    <!-- سيتم حقن المحادثات هنا -->
                </div>
            </div>

            <!-- MAIN CHAT AREA -->
            <div class="chat-main-area" id="chat-main-area">
                <div class="no-chat-selected" id="no-chat-selected">
                    <p>اختر محادثة من القائمة للبدء في مراسلة أصدقائك</p>
                </div>

                <div class="active-chat-box" id="active-chat-box" style="display: none;">
                    <!-- Chat Header -->
                    <div class="active-chat-header">
                        <img id="active-user-avatar" src="" alt="Avatar">
                        <div>
                            <h4 id="active-user-name">...</h4>
                            <span class="online-status">متصل الآن</span>
                        </div>
                    </div>

                    <!-- Messages Feed -->
                    <div class="chat-messages-feed" id="chat-messages-feed">
                        <!-- الرسائل تظهر هنا -->
                    </div>

                    <!-- Message Input Form -->
                    <form class="chat-input-form" id="chat-input-form">
                        <input type="text" id="chat-message-input" placeholder="اكتب رسالتك هنا..." autocomplete="off" required>
                        <button type="submit" class="btn-primary">إرسال</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="/js/chat.js"></script>
</body>
</html>
