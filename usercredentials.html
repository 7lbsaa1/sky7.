<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توثيق الحساب - sky7</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar glass-card">
        <div class="nav-container">
            <a href="/home" class="nav-logo">
                <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7 logo">
                <span>sky7</span>
            </a>
            <div class="nav-menu">
                <a href="/home" class="nav-link">الرئيسية</a>
                <a href="/profile" class="nav-link">الملف الشخصي</a>
                <a href="/usercredentials" class="nav-link active">توثيق الحساب</a>
            </div>
        </div>
    </nav>

    <div class="container profile-container" style="max-width: 600px;">
        <div class="glass-card" style="padding: 30px; text-align: center;">
            <img src="/facebook-verified.png" alt="Verified Badge" style="width: 80px; margin-bottom: 20px;">
            <h2>طلب توثيق الحساب (Badge Verification)</h2>
            <p class="text-muted" style="margin-top: 10px; margin-bottom: 25px;">
                احصل على شارة التوثيق الزرقاء المميزة لتأكيد هوستك الرسمية على منصة sky7 لعشاق السماء والطبيعة.
            </p>

            <form id="verification-form">
                <div class="input-group" style="text-align: right; margin-bottom: 20px;">
                    <label for="verify-reason">سبب طلب التوثيق / نبذة عن نشاطك</label>
                    <textarea id="verify-reason" rows="4" required placeholder="اكتب لماذا تستحق توثيق حسابك (مصور فوتوغرافي، صانع محتوى...etc)"></textarea>
                </div>

                <div class="input-group" style="text-align: right; margin-bottom: 25px;">
                    <label for="verify-document">صورة إثبات الهوية أو الحساب المرتبط</label>
                    <input type="file" id="verify-document" accept="image/*" required style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 8px; color: white;">
                </div>

                <button type="submit" class="btn-primary" id="submit-verify-btn" style="width: 100%; padding: 12px;">إرسال طلب التوثيق</button>
            </form>
        </div>
    </div>

    <script type="module" src="/js/usercredentials.js"></script>
</body>
</html>
