<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأصدقاء والمستخدمون - sky7</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/users.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar glass-card">
        <div class="nav-container">
            <a href="/home" class="nav-logo">
                <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7 logo">
                <span>sky7</span>
            </a>
            <div class="nav-menu">
                <a href="/home" class="nav-link">الرئيسية</a>
                <a href="/users" class="nav-link active">الأصدقاء</a>
                <a href="/favorite" class="nav-link">المحفوظات</a>
                <a href="/profile" class="nav-link">الملف الشخصي</a>
            </div>
        </div>
    </nav>

    <div class="container users-container">
        <!-- SEARCH HEADER -->
        <div class="glass-card users-search-card">
            <h2>👥 اكتشف أصدقاء جدد في sky7</h2>
            <p class="text-muted">ابحث عن عشاق التصوير والسماء وتواصل معهم.</p>
            <div class="search-input-wrapper">
                <input type="text" id="users-search-input" placeholder="ابحث بالاسم أو المعرف (@username)...">
            </div>
        </div>

        <!-- USERS GRID -->
        <div class="users-grid" id="users-grid-container">
            <!-- سيتم حقن المستخدمين هنا عبر JavaScript -->
            <div class="glass-card user-card skeleton-card">
                <div class="sk-avatar"></div>
                <div class="sk-text"></div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/users.js"></script>
</body>
</html>
